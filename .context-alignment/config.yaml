# AIgile Context Alignment Configuration
version: 2.0

# Auto-commit before/after operations (safety backups)
auto_commit: true

# Scopes to extract (add your top-level directories)
scopes:
  - _repo-level

# Directories to skip during extraction
skip_dirs:
  - node_modules
  - .git
  - dist
  - build
  - .cache
  - .context-alignment-backup*
  - "*.lproj"
  - "*.xcassets"
  - "*.xcodeproj"
  - DerivedData
  - .swiftpm
  - .build
  - Designs

# Custom tags (optional) - Define your own XML-like tags for extraction
# Example: security, deployment, architecture tags
# These will create new section directories in .context-alignment/
# custom_tags:
#   - name: security
#     description: Security guidelines and best practices
#   - name: deployment
#     description: Deployment procedures and checklists
